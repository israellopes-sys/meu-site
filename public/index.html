<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - MPB Interativa</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-black text-white">

    <!-- FORMULÁRIO -->
    <div class="flex justify-center items-center min-h-screen">
        <div class="w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">

            <h1 class="text-3xl font-extrabold text-center mb-6">
                Crie Sua Conta <span class="text-blue-500">MPB</span>
            </h1>

            <form id="formCadastro">

                <!-- Nome -->
                <div class="mb-4">
                    <label for="nome">Nome Completo</label>

                    <input
                        id="nome"
                        type="text"
                        required
                        minlength="2"
                        class="w-full p-3 rounded-lg bg-gray-900 text-white border border-gray-700">

                    <p id="erroNome" class="text-red-400 text-sm mt-1"></p>
                </div>

                <!-- Email -->
                <div class="mb-6">
                    <label for="email">Email</label>

                    <input
                        id="email"
                        type="email"
                        required
                        class="w-full p-3 rounded-lg bg-gray-900 text-white border border-gray-700">

                    <p id="erroEmail" class="text-red-400 text-sm mt-1"></p>
                </div>

                <!-- Senha -->
                <div class="mb-6">
                    <label for="senha">Senha</label>

                    <input
                        id="senha"
                        type="password"
                        minlength="6"
                        required
                        class="w-full p-3 rounded-lg bg-gray-900 text-white border border-gray-700">

                    <p id="erroSenha" class="text-red-400 text-sm mt-1"></p>

                    <div class="mt-2">
                        <input type="checkbox" id="mostrarSenha">
                        <label for="mostrarSenha">Mostrar senha</label>
                    </div>
                </div>

                <!-- Confirmar senha -->
                <div class="mb-6">
                    <label for="confirmarSenha">Confirmar senha</label>

                    <input
                        id="confirmarSenha"
                        type="password"
                        required
                        class="w-full p-3 rounded-lg bg-gray-900 text-white border border-gray-700">

                    <p id="erroConfirmarSenha" class="text-red-400 text-sm mt-1"></p>
                </div>

                <!-- Botão -->
                <button
                    type="submit"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg">
                    Cadastrar
                </button>

            </form>

            <p class="text-center text-gray-400 mt-4 text-sm">
                Já tem conta?
                <a href="login.html" class="text-blue-500">
                    Faça Login
                </a>
            </p>

        </div>
    </div>

    <script>
        const form = document.getElementById('formCadastro');
        const campoSenha = document.getElementById('senha');
        const confirmarSenha = document.getElementById('confirmarSenha');
        const checkbox = document.getElementById('mostrarSenha');

        let enviando = false;

        // Mostrar / esconder senha
        checkbox.addEventListener('change', () => {
            campoSenha.type = checkbox.checked ? 'text' : 'password';
        });

        // Cadastro
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (enviando) {
                return;
            }

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = campoSenha.value;

            // Validação da confirmação de senha
            if (senha !== confirmarSenha.value) {
                confirmarSenha.setCustomValidity('As senhas não coincidem.');
            } else {
                confirmarSenha.setCustomValidity('');
            }

            // Validação nativa do navegador
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            enviando = true;

            // Limpa mensagens anteriores
            document.getElementById('erroNome').textContent = '';
            document.getElementById('erroEmail').textContent = '';
            document.getElementById('erroSenha').textContent = '';
            document.getElementById('erroConfirmarSenha').textContent = '';

            try {
                const resposta = await fetch('/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nome,
                        email,
                        senha
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw dados;
                }

                alert('Conta criada com sucesso! Faça seu login. 🎉');

                window.location.href = '/login.html';

            } catch (erro) {
                console.error('Erro na requisição:', erro);

                if (erro && erro.detalhes) {

                    erro.detalhes.forEach((item) => {

                        if (item.campo === 'nome') {
                            document.getElementById('erroNome').textContent =
                                item.mensagem;
                        }

                        if (item.campo === 'email') {
                            document.getElementById('erroEmail').textContent =
                                item.mensagem;
                        }

                        if (item.campo === 'senha') {
                            document.getElementById('erroSenha').textContent =
                                item.mensagem;
                        }
                    });

                } else if (erro && erro.erro) {
                    alert(erro.erro);

                } else {
                    alert('Não foi possível conectar ao servidor.');
                }

            } finally {
                enviando = false;
            }
        });
    </script>

</body>

</html>
