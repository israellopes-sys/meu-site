<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Música - MPB Interativa</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body>

    <main class="music-page">

        <!-- NAVEGAÇÃO -->
        <a href="home.html" class="music-back">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar
        </a>


        <!-- PLAYER -->
        <section class="music-player">

            <!-- CAPA -->
            <div class="music-cover" id="music-cover">

                <img
                    id="capa-musica"
                    src=""
                    alt="Capa da música"
                >

                <div
                    id="capa-placeholder"
                    class="music-cover-placeholder"
                >
                    <i class="fa-solid fa-music"></i>
                </div>

            </div>


            <!-- INFORMAÇÕES -->
            <div class="music-info">

                <span class="music-label">
                    MPB INTERATIVA
                </span>

                <h1 id="titulo">
                    Carregando...
                </h1>

                <p id="artista">
                    Carregando artista...
                </p>

            </div>


            <!-- PLAYER DE ÁUDIO -->
            <div class="audio-section">

                <audio
                    id="audioPlayer"
                    preload="metadata"
                ></audio>


                <div class="audio-progress">

                    <span id="tempoAtual">
                        0:00
                    </span>

                    <input
                        id="barraProgresso"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                    >

                    <span id="duracao">
                        0:00
                    </span>

                </div>


                <div class="audio-controls">

                    <button
                        id="btnPlay"
                        class="btn-play"
                        aria-label="Reproduzir"
                    >
                        <i
                            id="playIcon"
                            class="fa-solid fa-play"
                        ></i>
                    </button>

                </div>

            </div>


            <!-- AÇÕES -->
            <div class="music-actions">

                <button
                    id="btnCurtir"
                    class="pill-btn"
                    type="button"
                >
                    <i class="fa-regular fa-heart"></i>
                    Curtir
                </button>


                <a
                    id="btnComentarios"
                    class="pill-btn"
                    href="#"
                >
                    <i class="fa-regular fa-comment"></i>
                    Comentários
                </a>

            </div>


            <!-- USUÁRIO -->
            <p
                id="usuario-logado"
                class="music-user"
            ></p>

        </section>

    </main>


<script>

// ==========================================
// AUTENTICAÇÃO
// ==========================================

const token = localStorage.getItem('token');
const usuarioRaw = localStorage.getItem('usuarioLogado');

if (!token || !usuarioRaw) {

    window.location.href = 'login.html';

}

let usuario = null;

try {

    usuario = JSON.parse(usuarioRaw);

} catch (err) {

    console.error(
        'Erro ao ler usuário:',
        err
    );

    localStorage.removeItem('token');
    localStorage.removeItem('usuarioLogado');

    window.location.href = 'login.html';

}


// ==========================================
// ELEMENTOS
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );

const idMusica =
    params.get('id');


const audio =
    document.getElementById(
        'audioPlayer'
    );

const btnPlay =
    document.getElementById(
        'btnPlay'
    );

const playIcon =
    document.getElementById(
        'playIcon'
    );

const barraProgresso =
    document.getElementById(
        'barraProgresso'
    );

const tempoAtual =
    document.getElementById(
        'tempoAtual'
    );

const duracao =
    document.getElementById(
        'duracao'
    );


// ==========================================
// VALIDAR ID DA MÚSICA
// ==========================================

if (!idMusica) {

    alert(
        'Nenhuma música foi selecionada.'
    );

    window.location.href =
        'home.html';

}


// ==========================================
// EXIBIR USUÁRIO
// ==========================================

if (usuario) {

    document.getElementById(
        'usuario-logado'
    ).textContent =
        `Olá, ${usuario.nome} 👋`;

}


// ==========================================
// FORMATAR TEMPO
// ==========================================

function formatarTempo(segundos) {

    if (!Number.isFinite(segundos)) {
        return '0:00';
    }

    const minutos =
        Math.floor(segundos / 60);

    const segundosRestantes =
        Math.floor(segundos % 60);

    return `${minutos}:${String(
        segundosRestantes
    ).padStart(2, '0')}`;

}


// ==========================================
// CARREGAR MÚSICA
// ==========================================

async function carregarDetalhesMusica() {

    try {

        const resposta =
            await fetch(
                `http://localhost:3000/musicas/${idMusica}`
            );


        if (!resposta.ok) {

            throw new Error(
                'Música não encontrada.'
            );

        }


        const musica =
            await resposta.json();


        document.title =
            `${musica.titulo} - MPB Interativa`;


        document.getElementById(
            'titulo'
        ).textContent =
            musica.titulo;


        document.getElementById(
            'artista'
        ).textContent =
            musica.artista;


        // ----------------------------------
        // CAPA
        // ----------------------------------

        if (musica.capa) {

            const capa =
                document.getElementById(
                    'capa-musica'
                );

            capa.src =
                musica.capa;

            capa.style.display =
                'block';

            document.getElementById(
                'capa-placeholder'
            ).style.display =
                'none';

        }


        // ----------------------------------
        // ÁUDIO
        // ----------------------------------

        if (musica.arquivo_audio) {

            audio.src =
                musica.arquivo_audio;

        } else {

            console.warn(
                'Esta música não possui arquivo de áudio.'
            );

            btnPlay.disabled = true;

        }


        // ----------------------------------
        // COMENTÁRIOS
        // ----------------------------------

        document.getElementById(
            'btnComentarios'
        ).href =
            `comentarios.html?id=${idMusica}`;


    } catch (err) {

        console.error(
            'Erro ao carregar música:',
            err
        );


        document.getElementById(
            'titulo'
        ).textContent =
            'Erro ao carregar';


        document.getElementById(
            'artista'
        ).textContent =
            'Música não encontrada';

    }

}


// ==========================================
// PLAY / PAUSE
// ==========================================

btnPlay.addEventListener(
    'click',
    async () => {

        if (!audio.src) {
            return;
        }


        if (audio.paused) {

            await audio.play();

        } else {

            audio.pause();

        }

    }
);


// ==========================================
// ATUALIZAR BOTÃO PLAY
// ==========================================

audio.addEventListener(
    'play',
    () => {

        playIcon.className =
            'fa-solid fa-pause';

        btnPlay.setAttribute(
            'aria-label',
            'Pausar'
        );

    }
);


audio.addEventListener(
    'pause',
    () => {

        playIcon.className =
            'fa-solid fa-play';

        btnPlay.setAttribute(
            'aria-label',
            'Reproduzir'
        );

    }
);


// ==========================================
// DURAÇÃO
// ==========================================

audio.addEventListener(
    'loadedmetadata',
    () => {

        duracao.textContent =
            formatarTempo(
                audio.duration
            );

    }
);


// ==========================================
// PROGRESSO
// ==========================================

audio.addEventListener(
    'timeupdate',
    () => {

        if (!audio.duration) {
            return;
        }


        const progresso =
            (audio.currentTime /
                audio.duration) *
            100;


        barraProgresso.value =
            progresso;


        tempoAtual.textContent =
            formatarTempo(
                audio.currentTime
            );

    }
);


barraProgresso.addEventListener(
    'input',
    () => {

        if (!audio.duration) {
            return;
        }


        audio.currentTime =
            (barraProgresso.value / 100) *
            audio.duration;

    }
);


// ==========================================
// CURTIR — VISUAL POR ENQUANTO
// ==========================================

document
    .getElementById('btnCurtir')
    .addEventListener(
        'click',
        function () {

            this.classList.toggle(
                'liked'
            );


            if (
                this.classList.contains(
                    'liked'
                )
            ) {

                this.innerHTML = `
                    <i class="fa-solid fa-heart"></i>
                    Curtido
                `;

            } else {

                this.innerHTML = `
                    <i class="fa-regular fa-heart"></i>
                    Curtir
                `;

            }

        }
    );


// ==========================================
// INICIALIZAÇÃO
// ==========================================

document.addEventListener(
    'DOMContentLoaded',
    carregarDetalhesMusica
);

</script>

</body>
</html>
