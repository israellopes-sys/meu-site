<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comentários - MPB Interativa</title>

    <link rel="stylesheet" href="css/style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body>

    <main class="comments-page">

        <!-- CABEÇALHO -->
        <header class="comments-header">

            <a href="javascript:history.back()" class="comments-back">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar
            </a>

            <div class="comments-title-area">
                <span class="comments-label">COMUNIDADE MPB</span>

                <h1>
                    Comentários
                    <span class="text-highlight">MPB</span>
                </h1>

                <p id="musica-info">
                    Compartilhe o que você achou dessa música.
                </p>
            </div>

        </header>


        <!-- CONTEÚDO -->
        <section class="comments-content">

            <div class="comments-section-header">

                <div>
                    <span class="comments-label">DISCUSSÃO</span>

                    <h2>
                        O que você achou?
                    </h2>
                </div>

                <span id="contador-comentarios" class="comments-count">
                    0 comentários
                </span>

            </div>


            <!-- LISTA DE COMENTÁRIOS -->
            <div id="lista-comentarios" class="comments-list">

                <div class="comments-loading">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Carregando comentários...
                </div>

            </div>


            <!-- NOVO COMENTÁRIO -->
            <section class="comment-form-card">

                <div class="comment-form-header">

                    <div class="comment-avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div>
                        <h3>Deixe seu comentário</h3>
                        <p>Compartilhe sua opinião sobre essa música.</p>
                    </div>

                </div>


                <textarea
                    id="novoComentario"
                    placeholder="Escreva seu comentário..."
                    maxlength="500"
                ></textarea>

                <div class="comment-form-footer">

                    <span id="contador-caracteres">
                        0 / 500
                    </span>

                    <button
                        id="btnEnviarComentario"
                        class="btn-primary comment-submit"
                        onclick="enviarComentario()"
                    >
                        <i class="fa-solid fa-paper-plane"></i>
                        Comentar
                    </button>

                </div>

            </section>

        </section>

    </main>


<script>

const params = new URLSearchParams(window.location.search);
const idMusica = params.get('id');

const API_URL = 'http://localhost:3000';


// ==========================================
// VERIFICAR MÚSICA
// ==========================================

if (!idMusica) {

    alert("Nenhuma música selecionada.");

    window.location.href = 'home.html';

}


// ==========================================
// CARREGAR INFORMAÇÕES DA MÚSICA
// ==========================================

async function carregarMusica() {

    try {

        const resposta = await fetch(
            `${API_URL}/musicas/${idMusica}`
        );

        if (!resposta.ok) {
            throw new Error("Música não encontrada.");
        }

        const musica = await resposta.json();

        const info = document.getElementById('musica-info');

        info.textContent =
            `${musica.titulo} • ${musica.artista}`;

    } catch (err) {

        console.error(
            "Erro ao carregar música:",
            err
        );

    }

}


// ==========================================
// CARREGAR COMENTÁRIOS
// ==========================================

async function carregarComentarios() {

    const lista =
        document.getElementById('lista-comentarios');

    try {

        const res = await fetch(
            `${API_URL}/comentarios/${idMusica}`
        );

        if (!res.ok) {
            throw new Error(
                "Erro ao buscar comentários."
            );
        }

        const comentarios = await res.json();

        lista.innerHTML = '';

        document.getElementById(
            'contador-comentarios'
        ).textContent =
            `${comentarios.length} ${
                comentarios.length === 1
                    ? 'comentário'
                    : 'comentários'
            }`;


        // Nenhum comentário

        if (comentarios.length === 0) {

            lista.innerHTML = `
                <div class="comments-empty">

                    <div class="comments-empty-icon">
                        <i class="fa-regular fa-comment-dots"></i>
                    </div>

                    <h3>Ninguém comentou ainda</h3>

                    <p>
                        Seja a primeira pessoa a compartilhar
                        sua opinião sobre essa música.
                    </p>

                </div>
            `;

            return;

        }


        // Renderizar comentários

        comentarios.forEach(comentario => {

            const dataFormatada =
                new Date(
                    comentario.data_comentario
                ).toLocaleDateString(
                    'pt-BR',
                    {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    }
                );


            const nomeUsuario =
                comentario.usuario
                    ? comentario.usuario.nome
                    : "Usuário";


            lista.innerHTML += `

                <article class="comment-card">

                    <div class="comment-avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div class="comment-body">

                        <div class="comment-top">

                            <strong>
                                ${nomeUsuario}
                            </strong>

                            <span>
                                ${dataFormatada}
                            </span>

                        </div>

                        <p>
                            ${comentario.texto}
                        </p>

                    </div>

                </article>

            `;

        });


    } catch (err) {

        console.error(
            "Erro ao carregar comentários:",
            err
        );

        lista.innerHTML = `

            <div class="comments-error">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <p>
                    Não foi possível carregar os comentários.
                </p>

            </div>

        `;

    }

}


// ==========================================
// ENVIAR COMENTÁRIO
// ==========================================

let enviandoComentario = false;


async function enviarComentario() {

    if (enviandoComentario) {
        return;
    }


    const campoTexto =
        document.getElementById('novoComentario');

    const texto =
        campoTexto.value.trim();


    if (!texto) {

        alert(
            "Digite alguma coisa antes de enviar!"
        );

        campoTexto.focus();

        return;

    }


    const usuarioRaw = localStorage.getItem('usuarioLogado');
    const token = localStorage.getItem('token');

    let usuario = null;

    try {

        if (usuarioRaw) {
            usuario = JSON.parse(usuarioRaw);
        }

    } catch (e) {

        console.error(
            "Erro ao ler dados do usuário:",
            e
        );

    }

    if (!usuario || !token) {

        alert("Você precisa estar logado para comentar!");

        window.location.href = 'login.html';

        return;

    }


    try {

        enviandoComentario = true;


        const botao =
            document.getElementById(
                'btnEnviarComentario'
            );


        botao.disabled = true;

        botao.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Enviando...
        `;


        const res = await fetch(
            `${API_URL}/comentarios`,
            {
                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json',

                    'Authorization':
                        `Bearer ${token}`
                },

                body: JSON.stringify({
                    texto: texto,
                    id_musica:
                        Number(idMusica)
                })
            }
        );


        if (!res.ok) {

            const erro =
                await res.json();

            throw new Error(
                erro.erro ||
                'Erro ao enviar comentário.'
            );

        }


        campoTexto.value = '';

        atualizarContador();


        await carregarComentarios();


    } catch (err) {

        console.error(
            "Erro ao enviar comentário:",
            err
        );

        alert(
            err.message ||
            "Erro ao enviar comentário."
        );


    } finally {

        enviandoComentario = false;


        const botao =
            document.getElementById(
                'btnEnviarComentario'
            );


        botao.disabled = false;

        botao.innerHTML = `
            <i class="fa-solid fa-paper-plane"></i>
            Comentar
        `;

    }

}


// ==========================================
// CONTADOR DE CARACTERES
// ==========================================

function atualizarContador() {

    const campo =
        document.getElementById(
            'novoComentario'
        );

    const contador =
        document.getElementById(
            'contador-caracteres'
        );

    contador.textContent =
        `${campo.value.length} / 500`;

}


document
    .getElementById('novoComentario')
    .addEventListener(
        'input',
        atualizarContador
    );


// ==========================================
// INICIALIZAÇÃO
// ==========================================

document.addEventListener(
    'DOMContentLoaded',
    () => {

        carregarMusica();

        carregarComentarios();

    }
);

</script>

</body>
</html>
